[project]
name = "ytui"
version = "0.1.0"
description = "A Windows terminal UI for searching, playing, and downloading YouTube audio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blessed>=1.44.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
ytui = "ytui.main:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.ruff]
line-length = 100
